; 手首 磁気センサ (MLX90393) ファームウェア for M5Stack AtomS3
;
; 書き込み:
;   pio run -t upload
; シリアルモニタ:
;   pio device monitor

[env:atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
; USB CDC を Serial として使う (PC からは /dev/ttyACM* に見える)
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit MLX90393
    m5stack/M5Unified
