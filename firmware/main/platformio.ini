# PlatformIO Configuration File for Aero Hand Open / Custom Hand
# https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = right

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

# シリアルモニターの通信速度を設定 (firmware.ino の Serial.begin(921600) に同期)
monitor_speed = 921600

# ESP32-S3の内蔵USB CDC書き込み時の速度切替エラーを防ぐため、書き込み速度を115200に設定
upload_speed = 115200
upload_flags =
    --no-stub

# 必要な外部ライブラリの自動ダウンロード設定
lib_deps =
    # FEETECHサーボ公式ライブラリをGitHubから直接インポート
    https://github.com/ftservo/FTServo_Arduino.git

[env:right]
build_flags =
    -DRIGHT_HAND

[env:left]
build_flags =
    -DLEFT_HAND